<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAILIN GROUP</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        :root { --primary: #a855f7; --bg: #050208; --glass: rgba(30, 20, 40, 0.7); --glass-border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); background-image: radial-gradient(circle at 50% -20%, #3b0764, #050208); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #login-page { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; padding: 40px; background: var(--glass); backdrop-filter: blur(20px); border-radius: 40px; border: 1px solid var(--glass-border); text-align: center; }
        .pass-input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: #fff; text-align: center; font-size: 20px; outline: none; margin-top: 20px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 15px; margin-top: 20px; border: none; border-radius: 15px; background: var(--primary); color: #fff; font-weight: 800; cursor: pointer; }
        #main-content { display: none; width: 100%; max-width: 600px; padding: 20px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; background: rgba(255,255,255,0.03); padding: 5px; border-radius: 15px; }
        .tab-btn { flex: 1; padding: 12px 5px; background: transparent; border: none; color: #a1a1aa; cursor: pointer; border-radius: 10px; font-size: 13px; font-weight: 600; }
        .tab-btn.active { background: var(--primary); color: #fff; }
        .main-panel { background: var(--glass); backdrop-filter: blur(25px); border-radius: 30px; padding: 25px; border: 1px solid var(--glass-border); }
        .content-section { display: none; }
        .content-section.active { display: block; }
        textarea { width: 100%; height: 180px; padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: #fff; box-sizing: border-box; outline: none; margin-bottom: 15px; font-size: 14px; }
        .btn-calc { width: 100%; padding: 16px; border: none; border-radius: 15px; background: var(--primary); color: #fff; font-weight: 800; cursor: pointer; font-size: 16px; }
        .btn-logout { width: 100%; padding: 10px; margin-top: 25px; border: 1px solid rgba(255, 77, 77, 0.2); border-radius: 12px; background: transparent; color: #ff4d4d; cursor: pointer; font-size: 12px; }
        .result-box { background: #fff; color: #121212; border-radius: 20px; padding: 20px; margin-top: 20px; white-space: pre-wrap; font-weight: 700; font-family: 'Segoe UI', sans-serif; line-height: 1.6; }
        .btn-copy { width: 100%; padding: 12px; background: #121212; color: #fff; border: none; border-radius: 10px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; padding: 10px 25px; border-radius: 50px; display: none; font-size: 14px; z-index: 1000; }
        canvas { display: none; }
    </style>
</head>
<body onload="checkAuth()">

    <div id="login-page">
        <div style="font-size: 45px;">🛡️</div>
        <h2 style="margin: 10px 0;">PAILIN GROUP</h2>
        <input type="password" id="pass" class="pass-input" placeholder="PASSWORD" onkeydown="if(event.key === 'Enter') login()">
        <button class="btn-login" onclick="login()">LOGIN</button>
        <p id="err" style="color: #ff4d4d; margin-top: 10px; display: none; font-size: 14px;">รหัสผ่านไม่ถูกต้อง</p>
    </div>

    <div id="main-content">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(0)">📦 รวมแอด (แผนก 7)</button>
            <button class="tab-btn" onclick="switchTab(1)">⏳ ยอดบริษัท</button>
            <button class="tab-btn" onclick="switchTab(2)">🔍 เช็ค QR</button>
        </div>

        <div class="main-panel">
            <div id="sec0" class="content-section active">
                <textarea id="inAdd7" placeholder="วางข้อมูลแอดที่นี่..."></textarea>
                <button class="btn-calc" onclick="calculateAdd7()">🚀 สรุปแอดแผนก 7</button>
                <div id="resAdd7" style="display:none;" class="result-box"><div id="outAdd7"></div><button class="btn-copy" onclick="copyText('outAdd7')">📋 คัดลอกรายงาน</button></div>
            </div>

            <div id="sec1" class="content-section">
                <textarea id="inMoney" placeholder="วางยอดจาก Telegram..."></textarea>
                <button class="btn-calc" onclick="calculateMoney()">➕ รวมยอดบริษัท</button>
                <div id="resMoney" style="display:none;" class="result-box"><div id="outMoney"></div><button class="btn-copy" onclick="copyText('outMoney')">📋 คัดลอกรายงาน</button></div>
            </div>

            <div id="sec2" class="content-section">
                <div style="border: 2px dashed #444; padding: 30px; border-radius: 20px; text-align: center; color: #888; cursor: pointer;" onclick="document.body.focus()">📸 วางรูป QR Code</div>
                <div class="result-box" style="text-align:center;"><div id="outQR" style="font-size:24px; color:var(--primary);">---</div><button class="btn-calc" style="margin-top:10px; padding:10px;" onclick="copyQR()">📋 คัดลอก</button></div>
            </div>

            <button class="btn-logout" onclick="logout()">LOGOUT</button>
        </div>
    </div>

    <div id="toast">คัดลอกสำเร็จ!</div>
    <canvas id="canvas"></canvas>

    <script>
        const PASS = "admin777"; 
        const EXPIRE_TIME = 24 * 60 * 60 * 1000;

        function checkAuth() {
            const loginTime = localStorage.getItem('loginTime');
            const isAuth = localStorage.getItem('isAuth');
            if (isAuth === 'true' && loginTime) {
                if (new Date().getTime() - loginTime < EXPIRE_TIME) { showMain(); } else { logout(); }
            }
        }

        function login() {
            if (document.getElementById('pass').value === PASS) {
                localStorage.setItem('isAuth', 'true');
                localStorage.setItem('loginTime', new Date().getTime());
                showMain();
            } else { document.getElementById('err').style.display = 'block'; }
        }

        function showMain() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        function logout() { localStorage.clear(); location.reload(); }
        function switchTab(idx) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.content-section').forEach((s, i) => s.classList.toggle('active', i === idx));
        }

        const getN = (s) => { 
            let m = s.replace(/,/g, '').match(/(\d+)/); 
            return m ? parseInt(m[1]) : 0; 
        };

        function calculateAdd7() {
            const input = document.getElementById('inAdd7').value;
            const lines = input.split('\n');
            let d = { open:0, out:0, block:0, dup:0, remain:0, post:0, nopost:0, line:0, bill:0, cutCount:0, last:0, r1:0, rL:0 };
            let cutsMap = {};
            lines.forEach(l => {
                let s = l.trim().replace(/：/g, ':');
                if (s.includes('เข้าโอเพ่นแชท') || s.includes('ลูกค้าเข้า')) d.open += getN(s);
                if (s.includes('ออกกลุ่ม')) d.out += getN(s);
                if (s.includes('บล็อค')) d.block += getN(s);
                if (s.includes('ซ้ำ')) d.dup += getN(s);
                if (s.includes('เหลือลูกค้า') || s.includes('เหลือ :')) d.remain += getN(s);
                if (s.includes('กำลังโพส')) d.post += getN(s);
                if (s.includes('เข้ามาไม่โพส')) d.nopost += getN(s);
                if (s.includes('เข้าไลน์ออฟ')) d.line += getN(s);
                if (s.includes('เปิดบิล') && !s.includes('เชือด')) d.bill += getN(s);
                if (s.includes('งานสุดท้าย')) d.last += getN(s);
                if (s.includes('ซ่อมแรก')) d.r1 += getN(s);
                if (s.includes('ซ่อมสุดท้าย')) d.rL += getN(s);
                if (s.includes('เปิดบิลเชือด')) {
                    let m = s.match(/(\d+[,.]?\d*)\s*\/\s*(\d+[,.]?\d*)/g);
                    if (m) {
                        m.forEach(x => {
                            let p = x.split('/');
                            let v1 = parseInt(p[0].replace(/,/g, ''));
                            let v2 = parseInt(p[1].replace(/,/g, ''));
                            let pr = Math.max(v1, v2); let ct = Math.min(v1, v2);
                            d.cutCount += ct; cutsMap[pr] = (cutsMap[pr] || 0) + ct;
                        });
                    } else { d.cutCount += getN(s); }
                }
            });
            const timeStr = new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
            let res = `❗แผนก 7\nแจ้งแอด-สินค้ามือ 2\nรอบ ${timeStr}\n\n`;
            res += `ลูกค้าเข้าโอเพ่นแชท : ${d.open}\nออกกลุ่ม : ${d.out}\nบล็อค : ${d.block}\nซ้ำ : ${d.dup}\nเหลือลูกค้า : ${d.remain}\n\n`;
            res += `กำลังโพสขาย : ${d.post}\nเข้ามาไม่โพส : ${d.nopost}\nเข้าไลน์ออฟ : ${d.line}\n\n`;
            res += `เปิดบิล : ${d.bill}\nเปิดบิลเชือด : ${d.cutCount}\nงานสุดท้าย : ${d.last}\nซ่อมแรก : ${d.r1}\nซ่อมสุดท้าย : ${d.rL}\n\n`;
            Object.keys(cutsMap).sort((a,b)=>a-b).forEach(p => { res += `${Number(p).toLocaleString()} / ${cutsMap[p]}\n`; });
            document.getElementById('outAdd7').innerText = res; document.getElementById('resAdd7').style.display = 'block';
        }

        function calculateMoney() {
            const input = document.getElementById("inMoney").value;
            const lines = input.split('\n');
            let totalInP = 0, totalInM = 0, totalOutM = 0;
            lines.forEach(l => {
                let s = l.trim().replace(/,/g, '');
                if (s.includes("总入款金额")) {
                    let pMatch = s.match(/(\d+)\s*人/);
                    if (pMatch) totalInP += parseInt(pMatch[1]);
                    let parts = s.split(/[:：]/);
                    if (parts.length > 1) {
                        let val = parseFloat(parts[parts.length - 1].trim());
                        if (!isNaN(val)) totalInM += val;
                    }
                } else if (s.includes("出款") && !s.includes("-")) {
                    let parts = s.split(/[:：]/);
                    if (parts.length > 1) {
                        let val = parseFloat(parts[parts.length - 1].trim());
                        if (!isNaN(val)) totalOutM += val;
                    }
                }
            });

            // รายงานภาษาจีนเป๊ะๆ ตามที่มึงส่งมาล่าสุด
            let resText = `🧧 凤凰集团 拜林最牛逼 🧧\n\n`;
            resText += `💰总入款金额  ${totalInP.toLocaleString()} คน  : ${totalInM.toLocaleString()}\n`;
            resText += `💸出款   :  ${totalOutM.toLocaleString()}`;

            document.getElementById('outMoney').innerText = resText;
            document.getElementById('resMoney').style.display = 'block';
        }

        let lastQR = "";
        window.addEventListener('paste', e => {
            const item = e.clipboardData.items[0];
            if (item && item.type.includes('image')) {
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image(); img.src = ev.target.result;
                    img.onload = () => {
                        const cvs = document.getElementById('canvas'), ctx = cvs.getContext('2d');
                        cvs.width = img.width; cvs.height = img.height;
                        ctx.drawImage(img,0,0);
                        const code = jsQR(ctx.getImageData(0,0,cvs.width,cvs.height).data, cvs.width, cvs.height);
                        if(code) { 
                            let final = code.data.length >= 55 ? code.data.substring(40,55) : code.data;
                            document.getElementById('outQR').textContent = final; 
                            lastQR = final; switchTab(2); 
                        }
                    };
                };
                reader.readAsDataURL(item.getAsFile());
            }
        });

        function copyText(id) { navigator.clipboard.writeText(document.getElementById(id).innerText); showToast(); }
        function copyQR() { if(lastQR) { navigator.clipboard.writeText(lastQR); showToast(); } }
        function showToast() { const t = document.getElementById('toast'); t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); }
    </script>
</body>
</html>
