<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAILIN GROUP - LUXURY PURPLE</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        :root {
            --primary: #a855f7; 
            --primary-glow: rgba(168, 85, 247, 0.4);
            --bg: #050208;
            --glass: rgba(30, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #3b0764, #050208);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 600px; animation: fadeIn 0.8s ease-out; }

        .brand-logo {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }
        
        /* 🟣 โลโก้วิดีโอสี่เหลี่ยมตามรูป */
        .video-box {
            width: 130px; 
            height: 130px; 
            border-radius: 25px; /* สี่เหลี่ยมมุมมน */
            overflow: hidden;
            border: 2px solid var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
        }
        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tabs {
            display: flex; gap: 10px; margin-bottom: 20px;
            background: rgba(255,255,255,0.03); padding: 6px;
            border-radius: 20px; border: 1px solid var(--glass-border);
        }

        .tab-btn {
            flex: 1; padding: 14px 5px; background: transparent;
            border: none; color: #a1a1aa; cursor: pointer;
            border-radius: 15px; font-weight: 600; font-size: 14px; transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary); color: #fff;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .main-panel {
            background: var(--glass); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); border-radius: 35px;
            padding: 30px; border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        .content-section { display: none; }
        .content-section.active { display: block; animation: slideUp 0.4s ease-out; }

        h2 {
            text-align: center; color: var(--primary); font-size: 20px;
            margin-bottom: 20px; text-shadow: 0 0 10px var(--primary-glow); font-weight: 800;
        }

        textarea {
            width: 100%; height: 230px; padding: 18px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4);
            color: #fff; box-sizing: border-box; outline: none; font-size: 14px;
            margin-bottom: 20px; transition: 0.3s;
        }
        textarea:focus { border-color: var(--primary); }

        .btn-calc {
            width: 100%; padding: 18px; border: none; border-radius: 18px;
            background: var(--primary); color: #fff; font-size: 16px; font-weight: 800;
            cursor: pointer; transition: 0.2s;
        }

        .result-box {
            background: #ffffff; color: #121212; border-radius: 22px;
            padding: 25px; margin-top: 25px; position: relative; overflow: hidden;
        }
        .result-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: var(--primary); }

        .res-text { white-space: pre-wrap; font-weight: 700; font-size: 16px; font-family: 'Consolas', monospace; line-height: 1.6; }

        .btn-copy {
            width: 100%; padding: 14px; background: #121212; color: #fff;
            border: none; border-radius: 12px; cursor: pointer; margin-top: 15px; font-weight: bold;
        }

        .qr-area {
            border: 2px dashed rgba(168, 85, 247, 0.3); padding: 50px 20px;
            border-radius: 25px; text-align: center; color: #a1a1aa; cursor: pointer;
        }

        #toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: #fff; padding: 12px 35px;
            border-radius: 50px; font-weight: 800; display: none; z-index: 1000;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-logo">
        <div class="video-box">
            <video autoplay muted loop playsinline>
                <source src="money.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">📦 แอดมือ 2 (แผนก 7)</button>
        <button class="tab-btn" onclick="switchTab(1)">⏳ ยอดบริษัท</button>
        <button class="tab-btn" onclick="switchTab(2)">🔍 เช็ค QR</button>
    </div>

    <div class="main-panel">
        <div id="sec0" class="content-section active">
            <h2>📦 รวมแอดมือ 2 (แผนก 7)</h2>
            <textarea id="inAdd7" placeholder="วางข้อความทีมพนักงานที่นี่..."></textarea>
            <button class="btn-calc" onclick="calculateAdd7()">🚀 สรุปยอดแผนก 7</button>
            <div id="resAdd7" style="display:none;" class="result-box">
                <p id="outAdd7" class="res-text"></p>
                <button class="btn-copy" onclick="copyText('outAdd7')">📋 คัดลอกรายงาน</button>
            </div>
        </div>

        <div id="sec1" class="content-section">
            <h2>💰 PAILIN GROUP TOTAL</h2>
            <textarea id="inMoney" placeholder="วางยอดจาก Telegram..."></textarea>
            <button class="btn-calc" onclick="calculateMoney()">➕ กดรวมยอดทั้งหมด</button>
            <div id="resMoney" style="display:none;" class="result-box">
                <p id="outMoney" class="res-text"></p>
                <button class="btn-copy" onclick="copyText('outMoney')">📋 คัดลอกยอดรวม</button>
            </div>
        </div>

        <div id="sec2" class="content-section">
            <h2>🔍 Check QR Code</h2>
            <div class="qr-area" onclick="document.body.focus()">
                <div style="font-size: 40px; margin-bottom: 10px;">📸</div>
                กดที่นี่แล้ว <b>Ctrl + V</b> วางรูป QR
            </div>
            <div class="result-box" style="text-align:center;">
                <div id="outQR" style="font-size:35px; color:#a855f7; font-weight:900; margin:15px 0;">-</div>
                <button class="btn-calc" onclick="copyQR()">📋 คัดลอกเลขบัญชี</button>
            </div>
        </div>
    </div>
</div>

<div id="toast">คัดลอกสำเร็จ!</div>
<canvas id="canvas"></canvas>

<script>
    let lastQR = "";

    function switchTab(idx) {
        document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        document.querySelectorAll('.content-section').forEach((s, i) => s.classList.toggle('active', i === idx));
    }

    const getN = (s) => { 
        let m = s.replace(/,/g, '').match(/(\d+)/); 
        return m ? parseInt(m[1]) : 0; 
    };

    // --- 1. สรุปยอดแผนก 7 (Logic บิลเชือดเป๊ะตามสั่ง) ---
    function calculateAdd7() {
        const input = document.getElementById('inAdd7').value;
        const lines = input.split('\n');
        let d = { open:0, out:0, block:0, dup:0, remain:0, post:0, nopost:0, line:0, bill:0, cutCount:0, last:0, r1:0, rL:0 };
        let cutsMap = {};

        lines.forEach(line => {
            let l = line.trim().replace(/：/g, ':');
            if (l === "") return;
            if (l.includes('เข้าโอเพ่นแชท')) d.open += getN(l);
            if (l.includes('ออกกลุ่ม')) d.out += getN(l);
            if (l.includes('บล็อค')) d.block += getN(l);
            if (l.includes('ซ้ำ')) d.dup += getN(l);
            if (l.includes('เหลือลูกค้า')) d.remain += getN(l);
            if (l.includes('กำลังโพสขาย')) d.post += getN(l);
            if (l.includes('เข้ามาไม่โพส')) d.nopost += getN(l);
            if (l.includes('เข้าไลน์ออฟ')) d.line += getN(l);
            if (l.includes('เปิดบิล') && !l.includes('เชือด')) d.bill += getN(l);
            if (l.includes('งานสุดท้าย')) d.last += getN(l);
            if (l.includes('ซ่อมแรก')) d.r1 += getN(l);
            if (l.includes('ซ่อมสุดท้าย')) d.rL += getN(l);

            // ดึงเฉพาะบรรทัด "เปิดบิลเชือด" หรือ "บิลเชือด"
            if (l.includes('เปิดบิลเชือด') || l.includes('บิลเชือด')) {
                let matches = l.match(/(\d+[,.]?\d*)\s*\/\s*(\d+[,.]?\d*)/g);
                if (matches) {
                    matches.forEach(m => {
                        let parts = m.split('/');
                        let v1 = parts[0].replace(/,/g, '').replace(/\./g, '');
                        let v2 = parts[1].replace(/,/g, '').replace(/\./g, '');
                        let v1Num = parseInt(v1);
                        let v2Num = parseInt(v2);

                        let count, price;
                        // เช็คฝั่งราคา (ฝั่งที่เลขมากกว่า หรือเลขหลักพันขึ้นไป)
                        if (v1Num > v2Num && v1Num > 100) { price = v1; count = v2Num; } 
                        else { count = v1Num; price = v2; }
                        
                        d.cutCount += count;
                        cutsMap[price] = (cutsMap[price] || 0) + count;
                    });
                }
            }
        });

        const timeStr = new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});
        let res = `❗️แผนก 7\nแจ้งแอท-สินค้ามือ 2\nรอบ ${timeStr}\n\n`;
        res += `ลูกค้าเข้าโอเพ่นแชท : ${d.open}\nออกกลุ่ม : ${d.out}\nบล็อค : ${d.block}\nซ้ำ : ${d.dup}\nเหลือลูกค้า : ${d.remain}\n\n`;
        res += `กำลังโพสขาย : ${d.post}\nเข้ามาไม่โพส : ${d.nopost}\nเข้าไลน์ออฟ : ${d.line}\n\n`;
        res += `เปิดบิล : ${d.bill}\nเปิดบิลเชือด : ${d.cutCount}\nงานสุดท้าย : ${d.last}\nซ่อมแรก : ${d.r1}\nซ่อมสุดท้าย : ${d.rL}\n\n`;
        
        // เรียงราคาจากน้อยไปมาก
        Object.keys(cutsMap).sort((a,b) => a-b).forEach(p => {
            // ใส่คอมมาให้ราคาตอนแสดงผล
            let formattedPrice = Number(p).toLocaleString();
            res += `${formattedPrice} / ${cutsMap[p]}\n`;
        });

        document.getElementById('outAdd7').innerText = res;
        document.getElementById('resAdd7').style.display = 'block';
    }

    // --- 2. รวมยอดบริษัท ---
    function calculateMoney() {
        const text = document.getElementById("inMoney").value.replace(/,/g, '');
        let inP = 0, inM = 0, outM = 0;
        text.split('\n').forEach(l => {
            if (l.includes("总入款金额")) {
                let p = l.match(/(\d+)\s*人/); if(p) inP += parseInt(p[1]);
                let v = parseFloat(l.split(/[:：]/).pop()); if(!isNaN(v)) inM += v;
            } else if (l.includes("出款") && !l.includes("-")) {
                let v = parseFloat(l.split(/[:：]/).pop()); if(!isNaN(v)) outM += v;
            }
        });
        const f = (n) => n.toLocaleString('en-US');
        document.getElementById('outMoney').innerText = `🧧 凤凰集团 拜林最牛逼 🧧\n\n💰总入款金额  ${f(inP)} คน  : ${f(inM)}\n\n💸出款   :  ${f(outM)}`;
        document.getElementById('resMoney').style.display = 'block';
    }

    // --- 3. เช็ค QR ---
    window.addEventListener('paste', e => {
        const item = e.clipboardData.items[0];
        if (item && item.type.includes('image')) {
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image(); img.src = ev.target.result;
                img.onload = () => {
                    const cvs = document.getElementById('canvas'), ctx = cvs.getContext('2d');
                    cvs.width = img.width; cvs.height = img.height;
                    ctx.drawImage(img,0,0);
                    const code = jsQR(ctx.getImageData(0,0,cvs.width,cvs.height).data, cvs.width, cvs.height);
                    if(code) {
                        lastQR = code.data.length >= 55 ? code.data.substring(40,55) : code.data;
                        document.getElementById('outQR').textContent = lastQR;
                        switchTab(2); 
                    }
                };
            };
            reader.readAsDataURL(item.getAsFile());
        }
    });

    function copyText(id) { navigator.clipboard.writeText(document.getElementById(id).innerText); showToast(); }
    function copyQR() { if(lastQR) { navigator.clipboard.writeText(lastQR); showToast(); } }
    function showToast() { const t = document.getElementById('toast'); t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); }
</script>
</body>
</html>
